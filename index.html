<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Values Animation 1</title>
<style>
  :root {
    --fg: #000;
    --bg: #fff;
    --muted: #8a8a8a;
    --line: #e5e5e5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--fg);
    background: var(--bg);
    display: flex;
    -webkit-font-smoothing: antialiased;
  }

  /* Sidebar */
  aside {
    width: 300px;
    flex: none;
    height: 100%;
    border-right: 1px solid var(--fg);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  .block { padding: 24px; border-bottom: 1px solid var(--line); }
  .block:last-child { border-bottom: none; }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
  .sub { margin-top: 8px; font-size: 12px; color: var(--muted); }
  h2 {
    font-size: 11px; font-weight: 400; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--muted); margin-bottom: 14px;
  }

  ol.states { list-style: none; display: grid; gap: 2px; }
  ol.states li {
    display: flex; gap: 12px; align-items: baseline;
    font-size: 14px; padding: 4px 0; color: var(--muted);
    cursor: pointer; transition: color .15s;
  }
  ol.states li span:first-child { width: 16px; font-variant-numeric: tabular-nums; }
  ol.states li.active { color: var(--fg); }
  ol.states li:hover { color: var(--fg); }

  .field { margin-bottom: 16px; }
  .field:last-child { margin-bottom: 0; }
  .field label {
    display: flex; justify-content: space-between;
    font-size: 13px; margin-bottom: 8px;
  }
  .field label output { font-variant-numeric: tabular-nums; color: var(--muted); }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 16px; background: transparent; cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track { height: 1px; background: var(--fg); }
  input[type=range]::-moz-range-track { height: 1px; background: var(--fg); }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%;
    background: var(--fg); margin-top: -5.5px; border: none;
  }
  input[type=range]::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 50%; background: var(--fg); border: none;
  }

  .centred {
    background: linear-gradient(var(--fg), var(--fg)) center / 1px 9px no-repeat;
  }
  .scale {
    display: flex; justify-content: space-between; margin-top: 4px;
    font-size: 11px; color: var(--muted);
  }

  .seg { display: flex; border: 1px solid var(--fg); }
  .seg button {
    flex: 1; border: none; background: var(--bg); color: var(--fg);
    font: inherit; font-size: 12px; padding: 8px 4px; cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--fg); }
  .seg button.on { background: var(--fg); color: var(--bg); }

  .colour { display: flex; align-items: center; gap: 10px; }
  .swatch {
    flex: none; width: 36px; height: 36px; padding: 0;
    border: 1px solid var(--fg); cursor: pointer;
  }
  .swatch.open { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--fg); }

  /* Colour picker popover */
  .picker {
    position: fixed; z-index: 50; width: 232px; padding: 16px;
    background: var(--bg); border: 1px solid var(--fg);
    display: none; user-select: none; -webkit-user-select: none;
  }
  .picker.show { display: block; }
  .picker .sv {
    position: relative; width: 200px; height: 200px; cursor: crosshair;
    touch-action: none;
  }
  .picker .sv::before, .picker .sv::after { content: ""; position: absolute; inset: 0; }
  .picker .sv::before { background: linear-gradient(to right, #fff, rgba(255,255,255,0)); }
  .picker .sv::after { background: linear-gradient(to top, #000, rgba(0,0,0,0)); }
  .picker .hue {
    position: relative; height: 14px; margin-top: 12px; cursor: pointer; touch-action: none;
    background: linear-gradient(to right, #f00 0%, #ff0 16.66%, #0f0 33.33%, #0ff 50%, #00f 66.66%, #f0f 83.33%, #f00 100%);
  }
  .picker .knob {
    position: absolute; z-index: 1; width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.6);
    transform: translate(-50%, -50%); pointer-events: none;
  }
  .picker .hue .knob { top: 50%; width: 8px; height: 18px; border-radius: 0; }
  .picker .row { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .picker .row .chip { width: 24px; height: 24px; border: 1px solid var(--fg); flex: none; }
  .picker .row span { font-size: 13px; text-transform: uppercase; font-variant-numeric: tabular-nums; }
  .colour input[type=text] {
    flex: 1; min-width: 0; height: 36px; padding: 0 10px; border: 1px solid var(--fg);
    font: inherit; font-size: 13px; text-transform: uppercase; color: var(--fg); background: var(--bg);
  }
  .colour input[type=text]:focus { outline: none; box-shadow: inset 0 0 0 1px var(--fg); }

  .btn {
    width: 100%; font: inherit; font-size: 14px; padding: 12px 16px;
    border: 1px solid var(--fg); background: var(--bg); color: var(--fg);
    cursor: pointer; text-align: left; display: flex; justify-content: space-between;
  }
  .btn.primary { background: var(--fg); color: var(--bg); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn + .btn { margin-top: 8px; }

  .progress { margin-top: 12px; height: 1px; background: var(--line); position: relative; }
  .progress i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--fg); }
  .status { margin-top: 10px; font-size: 12px; color: var(--muted); min-height: 15px; }

  /* Stage */
  main {
    flex: 1; min-width: 0; height: 100%;
    display: flex; flex-direction: column;
  }
  .stage {
    flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
    padding: 40px;
  }
  canvas#view { display: block; border: 1px solid var(--line); }
  .timeline {
    border-top: 1px solid var(--line);
    padding: 16px 24px; display: flex; align-items: center; gap: 16px;
    font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .timeline .bar { flex: 1; height: 1px; background: var(--line); position: relative; cursor: pointer; }
  .timeline .bar::before { content: ""; position: absolute; inset: -8px 0; }
  .timeline .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--fg); width: 0; }
  .timeline .ticks span {
    position: absolute; top: -3px; width: 1px; height: 7px; background: var(--muted);
  }

  @media (max-width: 760px) {
    /* Split screen: animation pinned in the top half, controls scroll in
       the bottom half so edits are always visible. */
    html, body { height: 100%; height: 100dvh; overflow: hidden; }
    body { flex-direction: column; }
    main { order: -1; height: 50%; flex: none; }
    aside {
      flex: 1; min-height: 0; width: 100%; height: auto;
      overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
      border-right: none; border-top: 1px solid var(--fg);
    }
    .stage { padding: 12px; }
    .timeline { padding: 8px 16px; }
  }
  @media (pointer: coarse) {
    .seg button { min-height: 44px; }
    input[type=range] { height: 32px; touch-action: pan-y; }
    input[type=range]::-webkit-slider-thumb { width: 22px; height: 22px; margin-top: -10.5px; }
    input[type=range]::-moz-range-thumb { width: 22px; height: 22px; }
    #play { min-width: 44px; min-height: 44px; align-items: center; justify-content: center; }
  }
</style>
</head>
<body>

<aside>
  <div class="block">
    <h1>Values Animation 1</h1>
    <p class="sub">Ten triangles · six states · seamless loop</p>
  </div>

  <div class="block">
    <h2>States</h2>
    <ol class="states" id="states"></ol>
  </div>

  <div class="block">
    <h2>Colour</h2>
    <div class="field">
      <label>Icon</label>
      <div class="colour">
        <button class="swatch" id="fgPick" aria-label="Pick icon colour"></button>
        <input type="text" id="fgHex" value="#000000" maxlength="7" spellcheck="false">
      </div>
    </div>
    <div class="field">
      <label>Background</label>
      <div class="colour">
        <button class="swatch" id="bgPick" aria-label="Pick background colour"></button>
        <input type="text" id="bgHex" value="#ffffff" maxlength="7" spellcheck="false">
      </div>
    </div>
    <div class="field">
      <div class="seg" id="colourActions">
        <button data-v="swap">Swap</button>
        <button data-v="reset">Reset</button>
      </div>
    </div>
  </div>

  <div class="block">
    <h2>Motion</h2>
    <div class="field">
      <label>Hold <output id="holdOut"></output></label>
      <input type="range" id="hold" min="0.1" max="2" step="0.05" value="0.6">
    </div>
    <div class="field">
      <label>Transition <output id="transOut"></output></label>
      <input type="range" id="trans" min="0.2" max="2" step="0.05" value="0.7">
    </div>
    <div class="field">
      <label>Stagger <output id="staggerOut"></output></label>
      <input type="range" id="stagger" min="0" max="0.06" step="0.005" value="0.02">
    </div>
    <div class="field">
      <label>Spin <output id="spinOut"></output></label>
      <input type="range" id="spin" class="centred" min="-1" max="1" step="0.01" value="0" title="Double-click to reset">
      <div class="scale"><span>Less</span><span>More</span></div>
    </div>
    <div class="field">
      <label>Easing</label>
      <div class="seg" id="easing">
        <button data-v="expo" class="on">Expo</button>
        <button data-v="cubic">Cubic</button>
        <button data-v="back">Back</button>
      </div>
    </div>
  </div>

  <div class="block">
    <h2>Export</h2>
    <div class="field">
      <label>Size</label>
      <div class="seg" id="size">
        <button data-v="1080" class="on">1080</button>
        <button data-v="2160">2160</button>
      </div>
    </div>
    <div class="field">
      <label>Frame rate</label>
      <div class="seg" id="fps">
        <button data-v="30">30</button>
        <button data-v="60" class="on">60</button>
      </div>
    </div>
    <div class="field">
      <label>Loops <output id="loopsOut"></output></label>
      <input type="range" id="loops" min="1" max="10" step="1" value="1">
    </div>
    <button class="btn primary" id="download"><span>Download MP4</span><span>↓</span></button>
    <div class="progress"><i id="prog"></i></div>
    <div class="status" id="status"></div>
  </div>
</aside>

<div class="picker" id="picker">
  <div class="sv" id="pkSV"><i class="knob" id="pkSVKnob"></i></div>
  <div class="hue" id="pkHue"><i class="knob" id="pkHueKnob"></i></div>
  <div class="row"><i class="chip" id="pkChip"></i><span id="pkHex"></span></div>
</div>

<main>
  <div class="stage" id="stage"><canvas id="view"></canvas></div>
  <div class="timeline">
    <button class="btn" id="play" style="width:auto;padding:6px 12px;font-size:12px">Pause</button>
    <span id="time">0.00s</span>
    <div class="bar" id="bar"><div class="ticks" id="ticks"></div><i id="barFill"></i></div>
    <span id="dur">0.00s</span>
  </div>
</main>

  return match;
}

// Motion plan per transition: for each starting triangle, which target pose
// it flies to and how far it turns. Driven by the Spin control (-1…1):
//   0   → Figma's own numbering, shortest turn (the default)
//   < 0 → the ten triangles are identical, so let them swap targets to avoid
//         turning; at -1 rotation is minimised outright
//   > 0 → add whole extra turns, one triangle at a time, up to 1 each
let PLAN = [];
function buildPlan(spin) {
  PLAN = POSES.map((from, s) => {
    const to = POSES[(s+1) % POSES.length];
    let match = IDS.map((_, i) => i);
    if (spin < 0) {
      const w = -spin;
      const cost = from.map((p, i) => to.map((q, j) =>
        Math.abs(shortestTurn(p.a, q.a, 1)) / (Math.PI/2) +
        0.25 * Math.hypot(q.x - p.x, q.y - p.y) / LEG +
        (i === j ? 0 : (1 - w) * 2.5)));
      match = assign(cost);
    }
    const extra = spin > 0 ? Math.round(spin * IDS.length) : 0;
    return from.map((p, i) => {
      const q = to[match[i]];
      let d = shortestTurn(p.a, q.a, i % 2 ? -1 : 1);
      const turns = Math.floor(extra / IDS.length) + (i < extra % IDS.length ? 1 : 0);
      const dir = Math.abs(d) > 1e-6 ? Math.sign(d) : (i % 2 ? -1 : 1);
      d += dir * turns * 2 * Math.PI;
      return { q, d };
    });
  });
}

// ---------------------------------------------------------------------------
// Timing
// ---------------------------------------------------------------------------
const settings = { hold: 0.6, trans: 0.7, stagger: 0.02, easing: 'expo', spin: 0, fg: '#000000', bg: '#ffffff' };

const EASE = {
  expo: t => t === 0 ? 0 : t === 1 ? 1 : t < .5
    ? Math.pow(2, 20*t - 10) / 2 : (2 - Math.pow(2, -20*t + 10)) / 2,
  cubic: t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2,
  back: t => {
    const c1 = 1.2, c2 = c1 * 1.525;
    return t < .5
      ? (Math.pow(2*t, 2) * ((c2+1)*2*t - c2)) / 2
      : (Math.pow(2*t - 2, 2) * ((c2+1)*(t*2-2) + c2) + 2) / 2;
  },
};

const segLen = () => settings.hold + settings.trans;
const loopLen = () => segLen() * STATES.length;

// Returns the ten triangle poses at time t (seconds).
function posesAt(t) {
  const L = loopLen();
  t = ((t % L) + L) % L;
  const s = Math.min(STATES.length - 1, Math.floor(t / segLen()));
  const local = t - s * segLen();
  const from = POSES[s];
  if (local <= settings.hold) return from;

  const plan = PLAN[s];
  const tt = local - settings.hold;
  const stagger = Math.min(settings.stagger, settings.trans / 20);
  const each = settings.trans - stagger * (IDS.length - 1);
  const ease = EASE[settings.easing];
  return from.map((p, i) => {
    const k = ease(Math.max(0, Math.min(1, (tt - i*stagger) / each)));
    const { q, d } = plan[i];
    return {
      x: p.x + (q.x - p.x) * k,
      y: p.y + (q.y - p.y) * k,
      a: p.a + d * k,
    };
  });
}

function stateIndexAt(t) {
  const L = loopLen();
  t = ((t % L) + L) % L;
  const s = Math.floor(t / segLen());
  const local = t - s * segLen();
  return local < settings.hold + settings.trans / 2 ? s % STATES.length : (s + 1) % STATES.length;
}

// ---------------------------------------------------------------------------
// Drawing — all triangles go into one path (same winding) so shared edges
// don't show anti-aliasing seams.
// ---------------------------------------------------------------------------
function draw(ctx, size, t) {
  const sc = size / 1000;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = settings.bg;
  ctx.fillRect(0, 0, size, size);
  ctx.setTransform(sc, 0, 0, sc, 0, 0);
  ctx.beginPath();
  for (const p of posesAt(t)) {
    const ux = Math.cos(p.a), uy = Math.sin(p.a);
    const Px = p.x - ux * CENTROID_OFFSET, Py = p.y - uy * CENTROID_OFFSET;
    // legs at ±45° from the bisector
    const c = Math.SQRT1_2;
    const e1x = (ux*c - uy*c) * LEG, e1y = (ux*c + uy*c) * LEG;
    const e2x = (ux*c + uy*c) * LEG, e2y = (-ux*c + uy*c) * LEG;
    ctx.moveTo(Px, Py);
    ctx.lineTo(Px + e1x, Py + e1y);
    ctx.lineTo(Px + e2x, Py + e2y);
    ctx.closePath();
  }
  ctx.fillStyle = settings.fg;
  ctx.fill('nonzero');
}

// ---------------------------------------------------------------------------
// Preview
// ---------------------------------------------------------------------------
const view = document.getElementById('view');
const vctx = view.getContext('2d');
const stage = document.getElementById('stage');
let viewSize = 0;

function resize() {
  const r = stage.getBoundingClientRect();
  const cs = getComputedStyle(stage);
  const pad = parseFloat(cs.paddingLeft) * 2;
  const s = Math.max(100, Math.floor(Math.min(r.width - pad, r.height - pad)));
  const dpr = window.devicePixelRatio || 1;
  view.style.width = view.style.height = s + 'px';
  view.width = view.height = viewSize = Math.round(s * dpr);
}
new ResizeObserver(resize).observe(stage);
resize();

// State list
const statesEl = document.getElementById('states');
STATES.forEach((s, i) => {
  const li = document.createElement('li');
  li.innerHTML = `<span>${i+1}</span><span>${s.name}</span>`;
  li.onclick = () => { clock = i * segLen(); if (!playing) render(); };
  statesEl.appendChild(li);
});

let playing = true, clock = 0, last = performance.now();
const timeEl = document.getElementById('time');
const durEl = document.getElementById('dur');
const barFill = document.getElementById('barFill');
const ticks = document.getElementById('ticks');

function updateTicks() {
  ticks.innerHTML = '';
  for (let i = 1; i < STATES.length; i++) {
    const sp = document.createElement('span');
    sp.style.left = (i / STATES.length * 100) + '%';
    ticks.appendChild(sp);
  }
  durEl.textContent = loopLen().toFixed(2) + 's';
}

function render() {
  const L = loopLen();
  const t = ((clock % L) + L) % L;
  draw(vctx, viewSize, t);
  timeEl.textContent = t.toFixed(2) + 's';
  barFill.style.width = (t / L * 100) + '%';
  const si = stateIndexAt(t);
  [...statesEl.children].forEach((li, i) => li.classList.toggle('active', i === si));
}

function tick(now) {
  if (playing) clock += (now - last) / 1000;
  last = now;
  render();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

document.getElementById('play').onclick = e => {
  playing = !playing;
  e.currentTarget.textContent = playing ? 'Pause' : 'Play';
};
document.getElementById('bar').onclick = e => {
  const r = e.currentTarget.getBoundingClientRect();
  clock = (e.clientX - r.left) / r.width * loopLen();
};

// Controls
function bindRange(id, key, fmt) {
  const el = document.getElementById(id), out = document.getElementById(id + 'Out');
  const sync = () => {
    const prevPhase = key ? (clock % loopLen()) / loopLen() : 0;
    if (key) settings[key] = parseFloat(el.value);
    out.textContent = fmt(parseFloat(el.value));
    if (key) { clock = prevPhase * loopLen(); updateTicks(); }
  };
  el.oninput = sync; sync();
  return el;
}
bindRange('hold', 'hold', v => v.toFixed(2) + 's');
bindRange('trans', 'trans', v => v.toFixed(2) + 's');
bindRange('stagger', 'stagger', v => Math.round(v * 1000) + 'ms');
const spinEl = bindRange('spin', 'spin', v => {
  buildPlan(v);
  return Math.abs(v) < 0.005 ? 'Default' : (v > 0 ? '+' : '−') + Math.round(Math.abs(v) * 100) + '%';
});
// snap to the centre near the middle, and double-click to reset
spinEl.addEventListener('input', () => {
  if (Math.abs(spinEl.value) < 0.04 && spinEl.value != 0) { spinEl.value = 0; spinEl.oninput(); }
});
spinEl.ondblclick = () => { spinEl.value = 0; spinEl.oninput(); };
const loopsEl = bindRange('loops', null, v => '×' + v);

function bindSeg(id, onChange) {
  const el = document.getElementById(id);
  el.querySelectorAll('button').forEach(b => b.onclick = () => {
    el.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    onChange(b.dataset.v);
  });
  return () => el.querySelector('.on').dataset.v;
}
bindSeg('easing', v => settings.easing = v);

// Colours — picker and hex field stay in sync; hex accepts #rgb or #rrggbb.
const fgPick = document.getElementById('fgPick'), fgHex = document.getElementById('fgHex');
const bgPick = document.getElementById('bgPick'), bgHex = document.getElementById('bgHex');

function normHex(v) {
  v = v.trim().replace(/^#?/, '#').toLowerCase();
  if (/^#[0-9a-f]{3}$/.test(v)) v = '#' + [...v.slice(1)].map(c => c + c).join('');
  return /^#[0-9a-f]{6}$/.test(v) ? v : null;
}
function setColour(key, v, fromPicker) {
  settings[key] = v;
  const [pick, hex] = key === 'fg' ? [fgPick, fgHex] : [bgPick, bgHex];
  pick.style.background = v;
  if (document.activeElement !== hex) hex.value = v;
  if (!fromPicker && picker.key === key) picker.load(v);
}
function bindColour(key, pick, hex) {
  pick.onpointerdown = e => e.stopPropagation();
  pick.onclick = e => { e.stopPropagation(); picker.key === key ? picker.close() : picker.open(key, pick); };
  hex.oninput = () => { const v = normHex(hex.value); if (v) setColour(key, v); };
  hex.onblur = () => { hex.value = settings[key]; };
}

// In-app colour picker: saturation/brightness square + hue strip.
function hsvToHex(h, s, v) {
  const f = n => { const k = (n + h / 60) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); };
  return '#' + [f(5), f(3), f(1)].map(x => Math.round(x * 255).toString(16).padStart(2, '0')).join('');
}
function hexToHsv(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const max = Math.max(r, g, b), d = max - Math.min(r, g, b);
  let h = 0;
  if (d) h = max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return { h: (h * 60 + 360) % 360, s: max ? d / max : 0, v: max };
}

const picker = (() => {
  const el = document.getElementById('picker');
  const sv = document.getElementById('pkSV'), svKnob = document.getElementById('pkSVKnob');
  const hue = document.getElementById('pkHue'), hueKnob = document.getElementById('pkHueKnob');
  const chip = document.getElementById('pkChip'), hexOut = document.getElementById('pkHex');
  const api = { key: null, h: 0, s: 0, v: 0, anchor: null };

  function paint() {
    sv.style.background = hsvToHex(api.h, 1, 1);
    svKnob.style.left = (api.s * 100) + '%';
    svKnob.style.top = ((1 - api.v) * 100) + '%';
    hueKnob.style.left = (api.h / 360 * 100) + '%';
    const hex = hsvToHex(api.h, api.s, api.v);
    chip.style.background = hex;
    hexOut.textContent = hex;
  }
  function commit() { paint(); setColour(api.key, hsvToHex(api.h, api.s, api.v), true); }
  function place() {
    const r = api.anchor.getBoundingClientRect();
    const w = el.offsetWidth, h = el.offsetHeight;
    // open beside the sidebar; fall back to below the swatch when there's no room
    const side = document.querySelector('aside').getBoundingClientRect();
    let x = side.right + 12, y = r.top - 8;
    if (x + w > innerWidth - 8) { x = Math.min(r.left, innerWidth - w - 8); y = r.bottom + 8; }
    y = Math.max(8, Math.min(y, innerHeight - h - 8));
    el.style.left = x + 'px'; el.style.top = y + 'px';
  }
  function drag(area, onMove) {
    area.addEventListener('pointerdown', e => {
      area.setPointerCapture(e.pointerId);
      const move = ev => {
        const r = area.getBoundingClientRect();
        onMove(Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width)),
               Math.max(0, Math.min(1, (ev.clientY - r.top) / r.height)));
        commit();
      };
      move(e);
      area.onpointermove = move;
      area.onpointerup = area.onpointercancel = () => { area.onpointermove = null; };
    });
  }
  drag(sv, (x, y) => { api.s = x; api.v = 1 - y; });
  drag(hue, x => { api.h = Math.min(359.9, x * 360); });

  api.load = hex => {
    const c = hexToHsv(hex);
    // keep the current hue when the colour has none (greys)
    if (c.s > 0 && c.v > 0) api.h = c.h;
    api.s = c.s; api.v = c.v;
    paint();
  };
  api.open = (key, anchor) => {
    api.close();
    api.key = key; api.anchor = anchor;
    anchor.classList.add('open');
    api.load(settings[key]);
    el.classList.add('show');
    place();
  };
  api.close = () => {
    if (api.anchor) api.anchor.classList.remove('open');
    api.key = api.anchor = null;
    el.classList.remove('show');
  };
  el.addEventListener('pointerdown', e => e.stopPropagation());
  document.addEventListener('pointerdown', () => api.key && api.close());
  document.addEventListener('keydown', e => { if (e.key === 'Escape') api.close(); });
  addEventListener('resize', () => api.key && place());
  document.querySelector('aside').addEventListener('scroll', () => api.key && place());
  return api;
})();
bindColour('fg', fgPick, fgHex);
bindColour('bg', bgPick, bgHex);
setColour('fg', settings.fg); setColour('bg', settings.bg);
document.querySelectorAll('#colourActions button').forEach(b => b.onclick = () => {
  if (b.dataset.v === 'swap') { const f = settings.fg; setColour('fg', settings.bg); setColour('bg', f); }
  else { setColour('fg', '#000000'); setColour('bg', '#ffffff'); }
});
const getSize = bindSeg('size', () => {});
const getFps = bindSeg('fps', () => {});
updateTicks();

// ---------------------------------------------------------------------------
// MP4 export — renders every frame offline (frame-accurate, independent of
// playback) and encodes H.264 with WebCodecs, muxed by mp4-muxer.
// ---------------------------------------------------------------------------
const dlBtn = document.getElementById('download');
const statusEl = document.getElementById('status');
const prog = document.getElementById('prog');

async function pickCodec(w, h, fps, bitrate) {
  const candidates = ['avc1.640034', 'avc1.640033', 'avc1.640032', 'avc1.64002A', 'avc1.640028', 'avc1.4D0034', 'avc1.42003E'];
  for (const codec of candidates) {
    const cfg = { codec, width: w, height: h, bitrate, framerate: fps, avc: { format: 'avc' } };
    try {
      const r = await VideoEncoder.isConfigSupported(cfg);
      if (r.supported) return cfg;
    } catch (_) {}
  }
  return null;
}

dlBtn.onclick = async () => {
  if (!('VideoEncoder' in window)) {
    statusEl.textContent = 'MP4 export needs WebCodecs — use Chrome, Edge or Safari 17+.';
    return;
  }
  const size = parseInt(getSize()), fps = parseInt(getFps());
  const loops = parseInt(loopsEl.value);
  const bitrate = size >= 2160 ? 40e6 : 16e6;
  const total = Math.round(loopLen() * loops * fps);

  dlBtn.disabled = true;
  statusEl.textContent = 'Preparing…';
  prog.style.width = '0%';

  try {
    const cfg = await pickCodec(size, size, fps, bitrate);
    if (!cfg) throw new Error('No supported H.264 encoder for this size.');

    const muxer = new Mp4Muxer.Muxer({
      target: new Mp4Muxer.ArrayBufferTarget(),
      video: { codec: 'avc', width: size, height: size, frameRate: fps },
      fastStart: 'in-memory',
    });
    let encErr = null;
    const encoder = new VideoEncoder({
      output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
      error: e => { encErr = e; },
    });
    encoder.configure(cfg);

    const canvas = typeof OffscreenCanvas !== 'undefined'
      ? new OffscreenCanvas(size, size)
      : Object.assign(document.createElement('canvas'), { width: size, height: size });
    const ctx = canvas.getContext('2d', { alpha: false });
    const frameDur = 1e6 / fps;

    for (let i = 0; i < total; i++) {
      if (encErr) throw encErr;
      draw(ctx, size, i / fps);
      const frame = new VideoFrame(canvas, { timestamp: Math.round(i * frameDur), duration: Math.round(frameDur) });
      encoder.encode(frame, { keyFrame: i % (fps * 2) === 0 });
      frame.close();
      while (encoder.encodeQueueSize > 8) await new Promise(r => setTimeout(r, 0));
      if (i % 10 === 0) {
        prog.style.width = (i / total * 100) + '%';
        statusEl.textContent = `Encoding frame ${i} / ${total}`;
        await new Promise(r => setTimeout(r, 0));
      }
    }
    await encoder.flush();
    if (encErr) throw encErr;
    muxer.finalize();

    const blob = new Blob([muxer.target.buffer], { type: 'video/mp4' });
    const name = `Values-Animation-1_${size}_${fps}fps.mp4`;
    prog.style.width = '100%';
    statusEl.textContent = `Done · ${(blob.size / 1e6).toFixed(1)} MB · ${(total / fps).toFixed(2)}s`;
    await saveFile(blob, name);
  } catch (e) {
    console.error(e);
    statusEl.textContent = 'Export failed: ' + (e.message || e);
  } finally {
    dlBtn.disabled = false;
  }
};

// iOS / iPadOS ignore <a download> for blobs, so on touch devices hand the
// file to the native share sheet ("Save Video" / Files). Everywhere else use
// a regular download link.
async function saveFile(blob, name) {
  const file = new File([blob], name, { type: 'video/mp4' });
  const touch = matchMedia('(pointer: coarse)').matches;
  if (touch && navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: name });
      return;
    } catch (e) {
      if (e.name === 'AbortError') return;
      // Share needs a fresh user gesture after a long encode — offer a tap.
      statusEl.innerHTML = '';
      const b = document.createElement('button');
      b.className = 'btn';
      b.textContent = 'Tap to save video';
      b.onclick = () => navigator.share({ files: [file], title: name }).catch(() => {});
      statusEl.appendChild(b);
      return;
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

</script>
</body>
</html>
